<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc8e8"/>
      <stop offset="1" stop-color="#d9edf3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91d7e7" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#d8fbff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5ea2bb" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#202020" flood-opacity=".95"/>
    </filter>
    <pattern id="stone" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="#85878a"/>
      <path d="M0 0h72v72H0zM1 36h70M36 1v35M18 37v34M54 37v34" fill="none" stroke="#6b6d70" stroke-width="3"/>
      <path d="M3 3h66v30H3zM3 39h30v30H3zM39 39h30v30H39z" fill="none" stroke="#a3a5a8" stroke-width="2" opacity=".55"/>
    </pattern>
    <pattern id="floor" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#b8c4c8"/>
      <path d="M0 0h48v48H0zM24 0v48M0 24h48" stroke="#7f8e94" stroke-width="2"/>
      <path d="M2 2h20v20H2zM26 26h20v20H26z" fill="#dce5e7" opacity=".35"/>
    </pattern>
  </defs>

  <!-- UI design reference. -->
  <rect width="1440" height="900" fill="#101317"/>
  <text x="60" y="55" fill="#f0f3f5" font-family="Consolas, monospace" font-size="25" font-weight="700">SimpleLift · SCROLL SELECTION UI</text>
  <text x="1380" y="55" text-anchor="end" fill="#77818a" font-family="Consolas, monospace" font-size="16">IMPLEMENTED DESIGN MOCK · 1440 × 900</text>

  <g transform="translate(60 90)">
    <clipPath id="screenClip"><rect width="1320" height="735" rx="2"/></clipPath>
    <g clip-path="url(#screenClip)">
      <rect width="1320" height="735" fill="url(#sky)"/>

      <!-- Blocky lift interior -->
      <path d="M0 0h310l110 735H0z" fill="url(#stone)"/>
      <path d="M1320 0h-310L900 735h420z" fill="url(#stone)"/>
      <path d="M310 0h700L900 735H420z" fill="url(#glass)" stroke="#b8e5ed" stroke-width="5"/>
      <path d="M440 0 510 735M660 0v735M880 0 810 735" stroke="#d4f4f8" stroke-width="5" opacity=".55"/>
      <path d="M310 170h700M345 405h630" stroke="#d4f4f8" stroke-width="5" opacity=".48"/>
      <path d="M260 735h800l-105-190H365z" fill="url(#floor)"/>
      <path d="M365 545h590" stroke="#edf5f6" stroke-width="5" opacity=".7"/>

      <!-- Lift sign in view -->
      <g transform="translate(590 250)">
        <rect x="0" y="0" width="140" height="112" fill="#9a6b3d" stroke="#60401f" stroke-width="6"/>
        <path d="M8 10h124M8 38h124M8 66h124M8 94h124" stroke="#c8955d" stroke-width="3" opacity=".7"/>
        <text x="70" y="25" text-anchor="middle" fill="#2a1b0d" font-family="Consolas, monospace" font-size="13">Current Floor: 1</text>
        <text x="70" y="51" text-anchor="middle" fill="#2a1b0d" font-family="Consolas, monospace" font-size="13">Lobby</text>
        <text x="70" y="77" text-anchor="middle" fill="#2a1b0d" font-family="Consolas, monospace" font-size="13">Destination: 7</text>
        <text x="70" y="103" text-anchor="middle" fill="#2a1b0d" font-family="Consolas, monospace" font-size="13">Control Room</text>
      </g>

      <!-- Crosshair -->
      <g transform="translate(660 352)" fill="#fff" opacity=".9">
        <rect x="-2" y="-13" width="4" height="9"/>
        <rect x="-2" y="4" width="4" height="9"/>
        <rect x="-13" y="-2" width="9" height="4"/>
        <rect x="4" y="-2" width="9" height="4"/>
      </g>

      <rect width="1320" height="735" fill="url(#vignette)"/>

      <!-- Action bar: exact default message and colors -->
      <g font-family="Consolas, monospace" font-size="28" font-weight="700" filter="url(#shadow)">
        <text x="660" y="600" text-anchor="middle">
          <tspan fill="#ffff55">▲ </tspan><tspan fill="#ffffff">Floor 7 Control Room </tspan><tspan fill="#aaaaaa">(7/18) </tspan><tspan fill="#ffff55">▼</tspan>
        </text>
      </g>

      <!-- Hotbar. Slot 5 stays selected and empty while wheel events are cancelled. -->
      <g transform="translate(405 638)">
        <rect x="0" y="0" width="510" height="60" fill="#080808" opacity=".55"/>
        <g fill="#151515" fill-opacity=".72" stroke="#777" stroke-width="2">
          <rect x="3" y="3" width="54" height="54"/><rect x="59" y="3" width="54" height="54"/>
          <rect x="115" y="3" width="54" height="54"/><rect x="171" y="3" width="54" height="54"/>
          <rect x="227" y="3" width="54" height="54"/><rect x="283" y="3" width="54" height="54"/>
          <rect x="339" y="3" width="54" height="54"/><rect x="395" y="3" width="54" height="54"/>
          <rect x="451" y="3" width="54" height="54"/>
        </g>
        <!-- selected empty slot -->
        <rect x="224" y="0" width="60" height="60" fill="none" stroke="#f4f4f4" stroke-width="5"/>
        <rect x="229" y="5" width="50" height="50" fill="#222" fill-opacity=".25" stroke="#999" stroke-width="2"/>

        <!-- deliberately simple pixel-like item silhouettes -->
        <g stroke="#1b1b1b" stroke-width="2">
          <path d="M17 44 43 18l7 7-26 26z" fill="#b8b8b8"/><rect x="38" y="13" width="12" height="14" fill="#d7d7d7"/>
          <rect x="70" y="17" width="30" height="30" fill="#4ea04e"/><path d="M75 17v30M85 17v30M95 17v30" stroke="#7bc26d"/>
          <rect x="128" y="16" width="29" height="31" fill="#d1b759"/><path d="M128 27h29M139 16v31" stroke="#f2d97a"/>
          <rect x="185" y="17" width="27" height="29" fill="#65b6ca"/><path d="m185 17 27 29M212 17l-27 29" stroke="#9ce5ed"/>
          <rect x="296" y="18" width="28" height="28" fill="#b87945"/><path d="M296 28h28M306 18v28" stroke="#da9d66"/>
          <path d="M352 44h29V19h-29z" fill="#8c5c31"/><path d="M357 25h19M357 33h19" stroke="#d9b581"/>
          <rect x="408" y="17" width="28" height="30" fill="#aeb9c0"/><path d="M408 32h28M422 17v30" stroke="#e1e8eb"/>
          <path d="M464 47V19h28v28z" fill="#555"/><circle cx="478" cy="33" r="9" fill="#d33"/>
        </g>
      </g>

      <!-- health/food silhouettes -->
      <text x="430" y="628" fill="#ff4b55" font-family="Consolas, monospace" font-size="22" letter-spacing="2">♥♥♥♥♥♥♥♥♥♥</text>
      <text x="890" y="628" text-anchor="end" fill="#d9823c" font-family="Consolas, monospace" font-size="22" letter-spacing="2">●●●●●●●●●●</text>
    </g>
    <rect width="1320" height="735" fill="none" stroke="#343a40" stroke-width="2"/>
  </g>

  <g font-family="Consolas, monospace" font-size="16">
    <text x="60" y="860" fill="#aeb6bd">빈손 슬롯 유지</text>
    <text x="200" y="860" fill="#59626a">·</text>
    <text x="225" y="860" fill="#ffff55">노란색 ▲▼</text>
    <text x="350" y="860" fill="#59626a">·</text>
    <text x="375" y="860" fill="#ffffff">층·이름</text>
    <text x="465" y="860" fill="#59626a">·</text>
    <text x="490" y="860" fill="#aaaaaa">현재 순서/전체 층</text>
    <text x="1380" y="860" text-anchor="end" fill="#77818a">리소스팩 불필요 · Spigot/Paper 1.13+</text>
  </g>
</svg>
